<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=600">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ریاضیات برتر- وبلاگ ابوتراب پورحقانی</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://lib.arvancloud.ir/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://lib.arvancloud.ir/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-background"></div>
        <div class="container">
            <div class="header-top">
                <div class="header-titles">
                    <h1 class="site-title"><a href="index.html">ریاضیات برتر</a></h1>
                    <p class="site-subtitle"><a href="index.html">وبلاگ شخصی ابوتراب پورحقانی</a></p>
                </div>
                <button class="hamburger" id="sidebarToggle" aria-label="منوی کناری">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <nav class="horizontal-menu" id="mainNav">
                <ul id="staticPagesMenu">
                    <li><a href="index.html" data-page="home" class="active">صفحه اصلی</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-container container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>منو</h3>
                <button class="sidebar-close" id="sidebarClose">&times;</button>
            </div>
            <div class="sidebar-widget search-widget">
                <h3>جستجو</h3>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="جستجو در وبلاگ..." autocomplete="off">
                    <button id="searchButton" aria-label="جستجو">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
                <div id="searchResults" class="search-results" style="display: none;"></div>
            </div>
            <div class="sidebar-widget">
                <h3>یادداشت‌های منتخب</h3>
                <nav class="vertical-menu" id="favoriteMenu"><ul id="favoritePostsList"></ul></nav>
                <a href="?favorites=all" class="all-posts-link" data-favorites="all">مشاهده همه مطالب منتخب</a>
            </div>
            <div class="sidebar-widget">
                <h3>جدیدترین یادداشت‌ها</h3>
                <nav class="vertical-menu" id="sidebarMenu"><ul id="recentPostsList"></ul></nav>
                <a href="index.html" class="all-posts-link" data-page="all-posts">مشاهده همه مطالب</a>
            </div>
            <div class="sidebar-widget">
                <h3>لینک‌های مفید</h3>
                <nav class="vertical-menu" id="usefulLinksMenu"><ul id="usefulLinksList"></ul></nav>
            </div>
            <div class="sidebar-widget">
                <h3>برچسب‌ها</h3>
                <div class="tags-cloud" id="tagsCloud"></div>
            </div>
        </aside>
        <main class="content-area" id="mainContent">
            <div class="loading">در حال بارگذاری...</div>
        </main>
    </div>

    <div class="pagination" id="pagination"></div>

    <footer class="site-footer">
        <div class="container"><p>تمامی حقوق محفوظ است © ۱۴۰۵</p></div>
    </footer>

    <script src="assets/js/date-converter.js"></script>
    <script src="assets/js/blog-engine.js"></script>
    <script src="assets/js/search-engine.js"></script>
    <script src="assets/js/pagination.js"></script>
    <script src="assets/js/menu-builder.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
